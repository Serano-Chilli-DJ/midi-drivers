# Installed as /etc/alsa/conf.d/50-ns7ii.conf by install.sh (alsa-lib 1.2.x,
# e.g. 1.2.6 on Ubuntu / Pop!_OS 22.04, loads /etc/alsa/conf.d/*.conf itself).
# Gives the app end of the NS7II loopback a name: apps open "ns7ii" for output
# and input, and `aplay -L` / `arecord -L` list it as
# "ns7ii  Numark NS7II Audio Controller". ns7iid holds the other end
# (DEV=1, SUBDEV=0). plug converts format and rate only when needed and
# passes the app's channel count through (4 ch for master 1-2 + cue 3-4,
# 2 ch for plain stereo apps).

pcm.ns7ii {
	type plug
	slave.pcm "hw:CARD=Loopback,DEV=0,SUBDEV=0"
	hint {
		show on
		description "Numark NS7II Audio Controller"
	}
}

# Mixer lookups on "ns7ii" go to the Loopback card's controls.
ctl.ns7ii {
	type hw
	card Loopback
}
