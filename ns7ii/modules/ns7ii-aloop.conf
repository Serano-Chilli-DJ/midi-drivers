# Installed as /etc/modprobe.d/ns7ii-aloop.conf by install.sh.
# Pin the loopback card's id to "Loopback" (apps open hw:CARD=Loopback,...)
# and keep it off card slot 0 so it never becomes the default sound card.
# ns7iid uses subdevice 0 only; the default 8 subdevices stay available.
# Takes effect the next time the module loads (reboot, or
# `sudo modprobe -r snd-aloop && sudo modprobe snd-aloop` with nothing using it).
options snd-aloop index=-2 id=Loopback
